{% extends 'facturacion/base.html' %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4"><i class="bi bi-egg-fried"></i> Nuevo Pedido a Cocina</h2>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form id="form-pedido" method="POST">
    {% csrf_token %}

    <div class="card shadow-sm border-0 p-3 mb-4">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold"><i class="bi bi-signpost"></i> Mesa / Cliente / Referencia</label>
          <input type="text" id="mesa" name="mesa_o_cliente" class="form-control"
                 placeholder="Ej: Mesa 3, o nombre del cliente" required>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold"><i class="bi bi-chat-left-text"></i> Nota general (opcional)</label>
          <input type="text" name="nota" class="form-control" placeholder="Ej: para llevar">
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 p-3 mb-4 position-relative">
      <label class="form-label fw-bold"><i class="bi bi-search"></i> Agregar producto</label>
      <input type="text" id="buscar-prod" class="form-control"
             data-autocomplete="productos"
             data-resultados="resultados-prod"
             placeholder="Buscar o hacer clic para ver sugerencias..." autocomplete="off">
      <div id="resultados-prod" class="list-group position-absolute shadow mt-1"
           style="z-index: 1000; max-height: 240px; overflow-y: auto; top: 100%; left: 1rem; right: 1rem;"></div>
    </div>

    <div class="tabla-local mb-4">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="tabla-pedido">
          <thead>
            <tr>
              <th>Producto</th>
              <th style="width: 160px;">Cantidad</th>
              <th>Nota del ítem</th>
              <th class="text-center" style="width: 100px;">Acción</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla"></tbody>
        </table>
      </div>
    </div>

    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">
      <i class="bi bi-check-circle"></i> Enviar pedido a cocina
    </button>
  </form>
</div>

{% load static %}
<script src="{% static 'facturacion/js/pedido_form.js' %}"></script>
<script>
// Foco inicial: primero en "Mesa", pero si el usuario ya presionó
// Enter para saltar, el propio flujo lo lleva al buscador.
// Aquí solo reforzamos el foco en el buscador de productos.
document.addEventListener('DOMContentLoaded', function() {
    [100, 300, 700].forEach(function (ms) {
        setTimeout(function () {
            const mesa = document.getElementById('mesa');
            const input = document.getElementById('buscar-prod');
            // Si "mesa" está vacío, foco ahí. Si tiene contenido, foco en buscador.
            if (mesa && mesa.value.trim() === '') {
                mesa.focus();
            } else if (input) {
                input.focus();
            }
        }, ms);
    });
});
</script>
{% endblock %}
