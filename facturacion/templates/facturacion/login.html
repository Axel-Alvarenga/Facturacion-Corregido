{% extends 'facturacion/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="text-center mb-4"><i class="bi bi-shop"></i> Iniciar Sesión</h3>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} mb-3">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            {% if form.errors %}
                <div class="alert alert-danger">
                    Usuario o contraseña incorrectos. Intentá de nuevo.
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label fw-bold">
                        Nombre de usuario
                    </label>
                    <input type="text"
                           name="{{ form.username.name }}"
                           id="{{ form.username.id_for_label }}"
                           class="form-control"
                           placeholder="Ingresá tu usuario"
                           autofocus
                           required>
                </div>

                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label fw-bold">
                        Contraseña
                    </label>
                    <input type="password"
                           name="{{ form.password.name }}"
                           id="{{ form.password.id_for_label }}"
                           class="form-control"
                           placeholder="Ingresá tu contraseña"
                           required>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
