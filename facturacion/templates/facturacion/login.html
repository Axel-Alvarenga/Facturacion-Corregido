{% extends 'facturacion/base.html' %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 85vh;">
    <div class="card shadow-lg border-0 p-4" style="width: 100%; max-width: 420px; background-color: var(--color-superficie); border-radius: 1rem; border: 1px solid var(--color-borde);">
        
        <div class="text-center mb-4">
            <!-- Logo en el Login -->
            <img src="{% static 'facturacion/img/logo.png' %}" alt="Logo A.R.M." style="width: 130px; height: auto; margin-bottom: 1rem;">
            <h3 class="fw-bold" style="color: var(--color-texto);">Comedor A.R.M.</h3>
            <p class="texto-secundario small">Ingresá tus credenciales para continuar</p>
        </div>

        {% if form.non_field_errors %}
            <div class="alert alert-danger py-2 small mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i> {{ form.non_field_errors.0 }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="id_username" class="form-label fw-bold">Usuario</label>
                <input type="text" name="username" id="id_username" class="form-control form-control-lg" placeholder="Tu nombre de usuario" required autofocus autocomplete="username">
            </div>
            
            <div class="mb-4">
                <label for="id_password" class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" id="id_password" class="form-control form-control-lg" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema
            </button>
        </form>
    </div>
</div>
{% endblock %}
