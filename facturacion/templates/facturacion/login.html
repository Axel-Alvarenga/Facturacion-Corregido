{% extends 'facturacion/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="text-center mb-4"><i class="bi bi-shop"></i> Iniciar Sesión</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 fw-bold mt-2"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
