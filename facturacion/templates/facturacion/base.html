<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comedor A.R.M.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'facturacion/css/estilo.css' %}">
</head>
<body>
{% if user.is_authenticated %}
<nav class="navbar navbar-expand-lg navbar-dark navbar-local mb-4 no-print">
    <div class="container">
        <a class="navbar-brand" href="{% url 'dashboard' %}">
            <i class="bi bi-egg-fried"></i> Comedor A.R.M.
        </a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{% url 'dashboard' %}"><i class="bi bi-grid"></i> Inicio</a>
            <a class="nav-link" href="{% url 'cliente_list' %}"><i class="bi bi-people"></i> Clientes</a>
            <a class="nav-link" href="{% url 'producto_list' %}"><i class="bi bi-box-seam"></i> Productos</a>
            <a class="nav-link" href="{% url 'crear_venta' %}"><i class="bi bi-cart-plus"></i> Nueva venta</a>
            <a class="nav-link" href="{% url 'pedido_list' %}">
                <i class="bi bi-egg-fried"></i> Pedidos
                {% if pedidos_pendientes_nav %}<span class="badge bg-danger">{{ pedidos_pendientes_nav }}</span>{% endif %}
            </a>
            <a class="nav-link" href="{% url 'informes' %}"><i class="bi bi-graph-up"></i> Ventas / Informes</a>
        </div>
        <form action="{% url 'logout' %}" method="POST" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</button>
        </form>
    </div>
</nav>
{% endif %}
<div class="container">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
