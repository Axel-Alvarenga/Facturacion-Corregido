{% extends 'facturacion/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="mb-4">{% if object %}<i class="bi bi-pencil"></i> Editar producto{% else %}<i class="bi bi-plus-circle"></i> Nuevo producto{% endif %}</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary fw-bold"><i class="bi bi-check-circle"></i> Guardar</button>
                <a href="{% url 'producto_list' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
